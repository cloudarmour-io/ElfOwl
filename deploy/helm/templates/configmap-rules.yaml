apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ default "elf-owl-rules" .Values.rules.configMap.name }}
  namespace: {{ default .Release.Namespace .Values.rules.configMap.namespace }}
  labels:
    app: elf-owl
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
# ANCHOR: Canonical rules ConfigMap - Production parity
# Keeps the chart's mounted rules file aligned with the repository's full
# CIS ruleset by templating the chart-local copy verbatim into rules.yaml.
data:
  rules.yaml: |
{{ .Files.Get "files/cis-controls.yaml" | indent 4 }}
