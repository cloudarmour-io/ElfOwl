{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.owl.apiTokenSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: elf-owl
type: Opaque
stringData:
  api-token: {{ required "secrets.apiToken is required when secrets.create=true" .Values.secrets.apiToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.owl.signingKeySecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: elf-owl
type: Opaque
stringData:
  signing-key: {{ required "secrets.signingKey is required when secrets.create=true" .Values.secrets.signingKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.owl.encryptionKeySecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: elf-owl
type: Opaque
stringData:
  encryption-key: {{ required "secrets.encryptionKey is required when secrets.create=true" .Values.secrets.encryptionKey | quote }}
{{- end }}
